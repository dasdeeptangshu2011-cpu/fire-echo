name: FIRE-ECHO build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair generated source if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("Robot Control:'FIELD'", "'Robot Control':'FIELD'")
          s=s.replace("const icons:Record<Page,(p:{size?:number})=>JSX.Element>", "const icons:Record<Page,typeof HomeIcon>")
          s=s.replace("else if(p.type==='robot_telemetry')", "else if((p as {type?:string}).type==='robot_telemetry')")
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit automated source repair
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || (git commit -m 'chore: repair generated App source' && git push)
